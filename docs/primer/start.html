<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#2F3E46">
<title>Cider — your reports</title>
<!--
  The app's front door. Before this there was no "open the app" — only a link
  straight into one report's editor. This lists every report in projects.json
  as a card and lets you start a new one; picking a card is exactly the
  ?project= link edit.html already understands, so nothing about the editor
  itself changed to make this work.

  Named start.html, not index.html: that name is already taken by the actual
  published report (built by CI from content.md) — this app and that report
  are served from the same directory, and only one of them can be "index".
-->
<style>
  :root { --ink:#2F3E46; --sage:#6B9E78; --deep:#52796F; --mint:#E8EDE6;
          --pale:#D6E0D2; --line:#C9D6CD; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--mint);
    font:14px/1.5 system-ui, sans-serif; color:var(--ink); }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px;
    background:var(--ink); color:#fff; }
  header h1 { font-size:16px; margin:0; letter-spacing:.3px; font-weight:600; }
  header .sub { flex:1; font-size:12px; opacity:.75; }
  #new { background:var(--sage); color:#fff; border:0; border-radius:6px;
    padding:8px 16px; font:600 13px system-ui; cursor:pointer; }
  #new:hover { background:var(--deep); }
  #new:disabled { opacity:.5; cursor:default; }
  .ghost { background:none; color:#fff; border:1px solid rgba(255,255,255,.45);
    border-radius:6px; padding:8px 14px; font:600 13px system-ui; cursor:pointer; }
  .ghost:hover { border-color:#fff; background:rgba(255,255,255,.08); }
  main { max-width:960px; margin:0 auto; padding:28px 24px 60px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:18px; text-decoration:none; color:var(--ink); display:flex;
    flex-direction:column; gap:8px; transition:box-shadow .15s, transform .15s; }
  .card:hover { box-shadow:0 10px 26px rgba(47,62,70,.14); transform:translateY(-1px); }
  .card .icon { width:34px; height:34px; border-radius:8px; background:var(--pale);
    display:grid; place-items:center; color:var(--deep); font-size:16px; }
  .card .name { font-weight:600; font-size:14px; }
  .card .id { font:11px ui-monospace, monospace; color:#8B9A90; }
  #empty { color:#5B6E66; padding:40px 0; text-align:center; }
  #stat { padding:0 24px; font-size:12px; color:#5B6E66; min-height:16px; }

  #modal-bg { position:fixed; inset:0; background:rgba(47,62,70,.45);
    display:none; align-items:flex-start; justify-content:center; padding-top:14vh;
    z-index:50; }
  #modal-bg.open { display:flex; }
  #modal { background:#fff; border-radius:10px; width:min(420px, 92vw);
    box-shadow:0 20px 50px rgba(0,0,0,.28); overflow:hidden; }
  #modal header { background:var(--ink); padding:12px 16px; }
  #modal header h2 { margin:0; font-size:14px; color:#fff; }
  #modal .body { padding:16px; display:flex; flex-direction:column; gap:12px; }
  #modal label { font-size:12px; color:#5B6E66; display:flex; flex-direction:column; gap:5px; }
  #modal label[hidden] { display:none; }   /* the flex rule above beats [hidden]'s default */
  #modal input, #modal select { font:14px system-ui; padding:8px 10px;
    border:1px solid var(--line); border-radius:6px; background:#fff; }
  #modal .row { display:flex; gap:8px; justify-content:flex-end; }
  #modal button { font:600 13px system-ui; padding:7px 16px; border-radius:6px;
    cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); }
  #modal button.primary { background:var(--sage); border-color:var(--sage); color:#fff; }
  #modal button.primary:hover { background:var(--deep); border-color:var(--deep); }
  #modal button.primary:disabled { opacity:.5; cursor:default; }
  #modal .err { color:#C2703A; font-size:12px; min-height:14px; }
</style>
</head>
<body>
<header>
  <h1>Cider</h1>
  <span class="sub" id="hstat">loading your reports…</span>
  <button id="adopt" class="ghost">Adopt existing…</button>
  <button id="new" disabled>+ New report</button>
</header>
<main>
  <div id="grid"></div>
  <p id="empty" hidden>No reports yet — start one with "+ New report".</p>
</main>
<p id="stat"></p>

<div id="modal-bg">
  <div id="modal">
    <header><h2 id="np-title">New report</h2></header>
    <div class="body">
      <label id="np-root-l" hidden>Folder on this computer (the repo's clone)
        <input id="np-root" placeholder="~/BudgetPrimerFinal" autocomplete="off" spellcheck="false">
      </label>
      <label><span id="np-name-l">Title</span>
        <input id="np-name" placeholder="e.g. Housing Report 2027" autocomplete="off">
      </label>
      <label id="np-slug-l">Short id (used in the URL and file paths)
        <input id="np-slug" placeholder="housing-report-2027" autocomplete="off">
      </label>
      <!-- Templates come from the LOCAL server's engine (/__templates), so
           this row exists only when there is one to ask and it lists any.
           A template is a designed layout measured against its own sheet,
           so picking one stands the size select down. -->
      <label id="np-tpl-l" hidden>Start from
        <select id="np-tpl">
          <option value="" selected>Blank canvas</option>
        </select>
      </label>
      <!-- The template's topic colours, its own default first — filled in
           when a template is picked, hidden for the blank canvas. -->
      <label id="np-scheme-l" hidden>Colour scheme
        <select id="np-scheme"></select>
      </label>
      <label id="np-size-l">Page size
        <select id="np-size">
          <option value="letter" selected>Letter — 8.5 × 11 in</option>
          <option value="a4">A4 — 8.27 × 11.69 in</option>
          <option value="legal">Legal — 8.5 × 14 in</option>
          <option value="slide169">Slide 16:9 — PowerPoint widescreen</option>
          <option value="slide43">Slide 4:3 — classic PowerPoint</option>
        </select>
      </label>
      <p class="err" id="np-err"></p>
      <div class="row">
        <button type="button" id="np-cancel">Cancel</button>
        <button type="button" id="np-create" class="primary">Create</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// A LOCAL live server changes what this page can do: "+ New report" scaffolds
// straight onto disk, and "Adopt existing" registers a repo already cloned on
// this computer by its folder path. Detected once; everything gates on it.
// Local only if /__ping answers ok AND with JSON: a static host with SPA
// fallback answers 200 HTML for any path.
let LOCAL = false;
async function detectLocal() {
  try {
    const r = await fetch('/__ping', { cache: 'no-store' });
    LOCAL = r.ok && /json/i.test(r.headers.get('content-type') || '');
  } catch (e) { LOCAL = false; }
}

// --- registry ----------------------------------------------------------------
let REGISTRY = {};
async function loadRegistry() {
  try { REGISTRY = JSON.parse(await (await fetch('projects.json', { cache: 'no-store' })).text()); }
  catch (e) { REGISTRY = {}; }
}

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

function renderGrid() {
  const ids = Object.keys(REGISTRY);
  $('grid').innerHTML = ids.map(id => {
    const p = REGISTRY[id];
    return `<a class="card" href="edit.html?project=${encodeURIComponent(id)}">
      <span class="icon">▤</span>
      <span class="name">${esc(p.name || id)}</span>
      <span class="id">${esc(id)}</span>
    </a>`;
  }).join('');
  $('empty').hidden = ids.length > 0;
}

const PALETTE = ["#6B9E78","#95B7A2","#CAD2C5","#E8EDE6","#D6E0D2","#52796F","#354F52","#2F3E46","#FFFFFF"];

// Page size is chosen ONCE, here, at creation — not something the editor lets
// you change on an existing report. A brand-new report has nothing placed on
// it yet, so a size is free to pick; the Budget Primer's own report has ~900
// lines of pixel-precise figure layout built for Letter, and retrofitting a
// resize onto THAT is real, uninspected work (STANDALONE.md) this stays out of.
const PAGE_SIZES = {
  letter:   { w: 8.5, h: 11.0 },
  a4:       { w: 8.27, h: 11.69 },
  legal:    { w: 8.5, h: 14.0 },
  // PowerPoint's own numbers, so a deck made here prints/exports at exactly
  // the size a slide deck is expected to be.
  slide169: { w: 13.333, h: 7.5 },
  slide43:  { w: 10, h: 7.5 },
};


// --- new-report modal ----------------------------------------------------------
const slugify = s => s.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
$('np-name').addEventListener('input', () => {
  if (!$('np-slug').dataset.touched) $('np-slug').value = slugify($('np-name').value);
});
$('np-slug').addEventListener('input', () => { $('np-slug').dataset.touched = '1'; });

// One modal, two doors (both need the local server). "+ New report" scaffolds
// a fresh project on disk. "Adopt existing…" registers a repo already cloned
// on this computer by its folder path — nothing is written into that repo.
let modalMode = 'new';
function openModal(opts = {}) {
  modalMode = opts.adopt ? 'adopt' : 'new';
  const adopt = modalMode === 'adopt';
  $('np-title').textContent =
    adopt ? 'Adopt an existing project' : 'New report';
  $('np-name').value = ''; $('np-slug').value = ''; $('np-slug').dataset.touched = '';
  $('np-size').value = 'letter';
  $('np-size').disabled = false;
  $('np-tpl').value = '';
  $('np-err').textContent = '';
  // Offer the engine's templates — local only (there is no /__templates
  // anywhere else), fetched when the form opens so a template added to the engine appears without a reload.
  $('np-tpl-l').hidden = true;
  $('np-scheme-l').hidden = true;
  if (LOCAL && modalMode === 'new') {
    fetch('/__templates').then(r => r.json()).then(j => {
      const list = (j && j.templates) || [];
      if (!list.length || modalMode !== 'new') return;
      const sel = $('np-tpl');
      sel.length = 1;                       // keep only "Blank canvas"
      for (const t of list) {
        const o = document.createElement('option');
        o.value = t.id;
        o.textContent = `${t.name} — ${t.blurb}`;
        sel.appendChild(o);
      }
      $('np-tpl-l').hidden = false;
      // The size select speaks only for the blank canvas; a template brings
      // its own sheet. Grey it out rather than hide it, so the form doesn't
      // jump under the pointer. The scheme row is the template's topic
      // colours, its own default first — blank canvas has none to offer.
      sel.onchange = () => {
        $('np-size').disabled = !!sel.value;
        const t = list.find(x => x.id === sel.value);
        const schemes = (t && t.schemes) || [];
        const sch = $('np-scheme');
        sch.length = 0;
        schemes.forEach((s, i) => {
          const o = document.createElement('option');
          o.value = s.id;
          o.textContent = s.name + (i === 0 ? ' (default)' : '');
          sch.appendChild(o);
        });
        $('np-scheme-l').hidden = !schemes.length;
      };
      sel.onchange();
    }).catch(() => {});
  }
  // Adopt asks for a folder on this computer; a scaffold asks for an id and
  // a page size, which adoption reads instead.
  $('np-root-l').hidden = !adopt;
  if (adopt) $('np-root').value = '';
  $('np-slug-l').hidden = adopt;
  $('np-size-l').hidden = adopt;
  $('np-name-l').textContent = adopt ? 'Display name (optional)' : 'Title';
  $('np-create').textContent = adopt ? 'Adopt' : 'Create';
  $('modal-bg').classList.add('open');
  (adopt ? $('np-root') : $('np-name')).focus();
}
function closeModal() { $('modal-bg').classList.remove('open'); }
$('new').onclick = () => openModal();
$('adopt').onclick = () => openModal({ adopt: true });
$('np-cancel').onclick = closeModal;
$('modal-bg').addEventListener('click', e => { if (e.target === $('modal-bg')) closeModal(); });

$('np-create').onclick = async () => {
  // LOCAL adopt: a folder on this computer. The server reads that repo's own
  // docsync.yml, mounts every project it declares, and writes projects.json —
  // nothing is written into the adopted repo.
  if (LOCAL && modalMode === 'adopt') {
    const root = $('np-root').value.trim();
    if (!root) { $('np-err').textContent = 'name the folder the repo is cloned in'; return; }
    $('np-create').disabled = true;
    $('np-err').textContent = '';
    $('stat').textContent = `reading ${root}…`;
    try {
      const r = await fetch('/__adopt', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ root }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'adopt failed');
      $('stat').textContent = `adopted ${j.added.join(', ')} — opening…`;
      location.href = `edit.html?project=${encodeURIComponent(j.added[0])}`;
    } catch (e) {
      $('np-err').textContent = e.message;
      $('stat').textContent = '';
      $('np-create').disabled = false;
    }
    return;
  }

  // LOCAL new: scaffold straight onto disk — straight onto the server's disk.
  if (LOCAL && modalMode !== 'adopt') {
    const name = $('np-name').value.trim();
    const slug = slugify($('np-slug').value || name);
    if (!name || !slug) { $('np-err').textContent = 'a title and a short id are both needed'; return; }
    const size = PAGE_SIZES[$('np-size').value] || PAGE_SIZES.letter;
    $('np-create').disabled = true;
    $('np-err').textContent = '';
    $('stat').textContent = `creating "${name}"…`;
    try {
      const r = await fetch('/__scaffold', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, slug, size,
                               template: $('np-tpl').value || '',
                               scheme: $('np-scheme-l').hidden
                                 ? '' : $('np-scheme').value || '' }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'could not create it');
      $('stat').textContent = `"${name}" created — opening it…`;
      location.href = `edit.html?project=${encodeURIComponent(j.slug)}`;
    } catch (e) {
      $('np-err').textContent = e.message;
      $('stat').textContent = '';
      $('np-create').disabled = false;
    }
    return;
  }
};

(async () => {
  await detectLocal();
  await loadRegistry();
  renderGrid();
  const n = Object.keys(REGISTRY).length;
  $('hstat').textContent = n ? `${n} report${n > 1 ? 's' : ''}` : '';
  // Creating and adopting both write through the local server.
  $('new').disabled = !LOCAL;
  $('adopt').disabled = !LOCAL;
  if (!LOCAL) $('hstat').textContent =
    (n ? `${n} report${n > 1 ? 's' : ''} — ` : '') +
    'open from the local server or the staff hub to create reports';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
