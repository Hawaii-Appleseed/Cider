# Report bindings — the registry the draft editor and the build read.
#
# Each entry pairs a committed source file with the report it feeds. The files
# on disk are the single source of truth: prose is edited directly in
# content.md, by hand or through the draft editor. The `editor:` block below is
# what lets one generic editor serve any report.
#
# The two-way Google Doc sync this once had is gone and is not coming back.
# What replaced it is one-way and manual: `doc:` records the Google Doc a
# report was DRAFTED in, and File ▸ Import text from the Doc reads it and
# proposes where each section lands (docsync/docimport.py). The doc is never
# written to, so there is no conflict to detect — an import you did not want
# is one ⌘Z away. Set it from the editor rather than by hand.
#
#   id       kebab-case, unique
#   name     the title the staff hub's list shows (docsync/hub.py); the id otherwise
#   hub      false keeps a binding off the staff hub; every editor binding goes by default
#   content  the committed source the report reads
#   doc      optional: the Google Doc id this report is drafted in
#   build    the one command that rebuilds and publishes (make pub)
#   editor   what the draft editor needs to run this report in the browser

bindings:
  - id: budget-primer
    name: "Budget Primer FY2026–27"
    hub: false            # off the staff hub (docsync/hub.py): the test fixture; the live report is ~/BudgetPrimerFinal, a consumer
    content: report2027/content.md
    # The one build command, shared by the live server, the save endpoint and
    # CI — so the deployed page is always exactly what a build produces.
    build: make -C report2027 pub
    outputs:
      - report2027/web/index.html
      - docs/primer/index.html
    # Files the renderer doesn't read directly but the live server's rebuild
    # loop must still react to — hand-edited CSS/JS, or data the renderer only
    # reads through report2027/tools/build_data.py, not render_report.py.
    watch:
      - report2027/tools/*.py
      - report2027/web/primer.css
      - report2027/web/primer.js
      - report2027/data/*.json
      - report2027/manual/*.json
    # What the draft editor needs to run THIS report in the browser. Naming it
    # here is what lets one editor serve any report: the editor reads the
    # manifest staged beside it and knows nothing about the primer.
    editor:
      # The pages whose renderer calls C.extras() — read off
      # report2027/tools/render_report.py, and the list edit.html used to
      # hard-code as its fallback for every report.
      pages:
        - ["basics", "Budget Basics"]
        - ["process", "Budget Process"]
        - ["spent", "How Money Is Spent"]
        - ["categories", "Spending Categories"]
        - ["cip", "Capital Improvements"]
        - ["onetime", "One-Time & Emergency"]
        - ["funding", "Funding the Budget"]
        - ["taxes", "Taxes"]
        - ["whopays", "Who Pays"]
      dir: docs/primer               # published dir; editor + engine staged here
      render: report2027/tools/render_report.py
      out: report2027/web/index.html
      layout: report2027/layout.json
      assets: report2027/web/assets
      # The report's own colours, offered before anything custom. These are the
      # palette constants in render_report.py — Muted Teal through Charcoal.
      palette: ["#6B9E78", "#95B7A2", "#CAD2C5", "#E8EDE6", "#D6E0D2",
                "#52796F", "#354F52", "#2F3E46", "#FFFFFF"]
      page: [8.5, 11]                # inches
      margins: [0.62, 0.75]          # side, top — the text column, for snapping
      engine:                        # everything else the renderer reads
        # The logo SVGs ride along so a recolour (svg_img in render_report.py,
        # which inlines the file) renders in the browser preview too.
        - report2027/web/assets/appleseed-logo.svg
        - report2027/web/assets/appleseed-logo-white.svg
        - report2027/data/report_data.json
        - report2027/manual/obligated_costs.json
        - docs/js/departments_act175_fy2027.json
        - docs/js/historical_trends.json

  # RxKids — a real Hawaii Appleseed page (originally a Squarespace embed).
  # Every section is wired to [[slots]]/L.attr per the report-editor skill —
  # text, images, and section containers are all editable/movable. page size
  # is the page's own natural footprint (~1200px wide; tall — text wraps
  # taller in this fixed column than Squarespace's wider live layout), not a
  # print page — this project is a scrolling web page.
  - id: rxkids
    name: "RxKids Hawaiʻi"
    content: projects/rxkids/content.md
    # STAGE TWO done 2026-08-25: the cost table (county names, births, TANF
    # and additional-dollars columns) is fully slotted, keyed by county slug
    # rather than rank; the two expandable-section buttons are slots too.
    # Findings are errors from here on.
    editability: strict
    # Brand and decorative art: the cover lockup, the hero photo and the two
    # spot icons. Their alt text names an ASSET, not words on the page — a
    # person editing this report cannot change what the picture is. Swapping
    # the image itself is the editor's "Replace image…".
    editability_ok:
      - "RxKeiki Hawaiʻi — A Prescription for Health, Hope, and Opportunity: Cash for Moms and Babies"
      - "RxKids Hero Image"
      - "Love"
      - "Childcare Center"
    # Also re-stages the editor, unlike budget-primer's `make ... pub` (whose
    # Makefile target already depends on `editor` -> docsync.stage) — without
    # this, the watcher rebuilds the PUBLISHED page but leaves the staged
    # docs/rxkids/engine/ copy the live in-browser editor actually reads from
    # stale, so an edit's version bump fires with nothing new to show.
    build: python3 projects/rxkids/render_report.py && python3 -m docsync.stage --id rxkids
    outputs:
      - projects/rxkids/index.html
    # rxkids has no Makefile asset-copy step (unlike report2027's web/assets ->
    # docs/primer/assets), so local images are inlined as base64 data URIs at
    # render time (see render_report.py's data_uri()) rather than referenced
    # by path — this just needs the watcher to notice when the source file
    # itself changes.
    watch:
      - projects/rxkids/assets/*.png
    editor:
      dir: docs/rxkids
      render: projects/rxkids/render_report.py
      out: projects/rxkids/index.html
      layout: projects/rxkids/layout.json
      # rxkids.org's own brand palette: navy text, accent red, brand blue,
      # green, orange, white — the swatches the editor offers for recolouring.
      palette: ["#2A3A4D", "#EE303B", "#0082C9", "#00A750", "#F6921E", "#FFFFFF"]
      page: [12.5, 84]
      margins: [0.3, 0.3]
      engine:
        # The untouched source render_report.py reads at build time — must be
        # staged like any other file the renderer opens, or the browser's
        # virtual filesystem won't have it (unlike a real checkout on disk).
        - projects/rxkids/original.html
        - projects/rxkids/assets/rxkeiki-logo.png

  # A SECOND report on the same engine — the proof that one editor serves any
  # report. Scaffolded by hand the way "+ New report" would; its renderer
  # demonstrates the shared building blocks (docsync.blocks: graphic, card).
  - id: demo-report
    name: "Demo report"
    editability: strict
    content: projects/demo-report/content.md
    # See rxkids' build command above — same gap, same fix.
    build: python3 projects/demo-report/render_report.py && python3 -m docsync.stage --id demo-report
    outputs:
      - projects/demo-report/index.html
    editor:
      # Pages whose renderer calls C.extras() — where a whole new
      # section may be added. Kept in step with render_report.py by hand.
      pages:
        - ["page1", "Page 1"]
      dir: docs/demo
      render: projects/demo-report/render_report.py
      out: projects/demo-report/index.html
      layout: projects/demo-report/layout.json
      palette: ["#6B9E78", "#95B7A2", "#CAD2C5", "#E8EDE6",
                "#52796F", "#354F52", "#2F3E46", "#FFFFFF"]
      page: [8.5, 11]
      margins: [0.62, 0.75]

  # Example — a simple page whose prose lives entirely in a doc. Binding one
  # takes minutes: add <!-- docsync:start --> / <!-- docsync:end --> where the
  # content belongs, then add an entry like this.
  #
  # - id: snap-timeline
  #   doc: <doc-id>
  #   mode: fragment
  #   content: snap-timeline/content.md
  #   target: snap-timeline/index.html

  # Our Mission — Hawaiʻi Appleseed. STAGE TWO wiring done 2026-08-25: every
  # step ordinal, focus-area card, phase tab, CTA button and eyebrow propose
  # left unwired is now a slot. page height is a generous no-clip default for
  # a scrolling web page; trim once visible.
  - id: our-mission
    name: "Our Mission"
    content: projects/our-mission/content.md
    # The remaining findings are all Squarespace SITE nav/footer, carried
    # over verbatim by docsync.scaffold — this page does not own that chrome,
    # and editing it here would never reach the live site. Declared, not
    # wired: each string below is one exact occurrence in the edit-mode
    # build (python3 -m docsync.check --id our-mission to re-derive).
    editability: strict
    editability_ok:
      # Squarespace nav aria-labels, same provenance as the link text below.
      - "Social"
      - "Open menu"
      - "Previous section"
      - "Next section"
      - "How we work"
      - "Home"
      - "Issues"
      - "News"
      - "Research"
      - "Donate"
      - "About"
      - "Our Mission"
      - "Our Story"
      - "Our Team"
      - "Board"
      - "Main Website"
      - "HAWAIʻI APPLESEED"
      - "CENTER FOR LAW & ECONOMIC JUSTICE"
      - "Hawaiʻi Budget Bill Draft Tracker"
      # The site nav's logo mark and social icons: the same copied chrome as
      # the nav's words above, drawings with no report content in them.
      - "svg in .px-brand-mark"
      - "svg in .px-social"
      # ...and the nav bar, announcement strip and grain overlay themselves:
      # the website's chrome around the report, painted surfaces with no
      # report content (every-element-has-a-handle.spec.js reads these too).
      - "nav.px-nav"
      - "div.px-announce"
      - "div.px-grain"
    build: python3 projects/our-mission/render_report.py
    outputs:
      - projects/our-mission/index.html
    editor:
      dir: docs/our-mission
      render: projects/our-mission/render_report.py
      out: projects/our-mission/index.html
      layout: projects/our-mission/layout.json
      palette: ["#FFFFFF", "#2F3E46", "#52796F", "#84A98C", "#CAD2C5", "#6E7A7E", "#354F52", "#F7F9F5"]
      page: [12.5, 160]
      margins: [0.3, 0.3]
      engine:
        # Files render_report.py reads MUST be listed here or the browser's
        # virtual filesystem won't have them ("draft does not build").
        - projects/our-mission/original.html
        - projects/our-mission/body.slotted.html

  # Tax testimony one-pager — cross-campaign comparison of public testimony on
