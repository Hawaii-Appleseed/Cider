    name: "Tax Testimony One-Pager"
    content: projects/tax-testimony/content.md
    # STAGE TWO done 2026-08-24: section labels and organisation names are
    # slots; every tally is declared with C.derived(TALLY), naming the
    # command that remakes it. Findings are errors from here on.
    editability: strict
