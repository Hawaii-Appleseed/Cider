# The fact ledger: the figures Hawaiʻi Appleseed states, the number we stand
# behind for each, and where it comes from. `python3 -m docsync.facts check`
# lists every report that states one and flags any that says another number.
#
# status: proposed = seeded from the reports themselves, not yet checked;
# confirmed = checked against the primary source named in `source` (who and
# when in `checked`).

- id: capgains-share-over-400k
  says: Share of Hawaiʻi residents' net long-term capital gains reported by filers with Hawaiʻi AGI of $400,000 or more
  value: 77
  unit: pct
  shown: 77 percent
  as_of: tax year 2023
  source: Hawaiʻi Department of Taxation, Hawaiʻi Individual Income Tax Statistics, Tax Year 2023, Table 21 ($2,041.4M of $2,645.7M, residents)
  url: https://tax.hawaii.gov/stats/a5_1annual/a5_5ind_inc/
  match: capital gains.*\$400,000|\$400,000.*capital gains
  status: confirmed
  checked: Claude against the TY2023 XLSX, 2026-11-23
  note: 70 percent is the tax year 2022 figure (Table 21, residents and nonresidents together, $3,110.6M of $4,420.9M). Residents and nonresidents together in TY2023 are also 77 percent.

- id: top-income-tax-rate
  says: Hawaiʻi's top individual income tax rate, from tax year 2027
  value: 13
  unit: pct
  shown: 13 percent
  as_of: tax year 2027 (Act 24, SLH 2026)
  source: Act 24, SLH 2026 (SB 3125), signed May 21, 2026; brackets as presented by DOTAX to the Tax Review Commission, May 2026, slides 12-15
  url: https://www.capitol.hawaii.gov/session/measure_indiv.aspx?billtype=SB&billnumber=3125&year=2026
  match: top (income tax )?rate|wages are taxed up to|income from wages|taxed up to
  unless: typical state|effective|paid about|GET|general excise
  status: confirmed
  checked: Claude against the DOTAX presentation, 2026-11-23 (the Legislature's site refuses scripted reads; the Act text itself was not opened)
  note: 13 percent applies above $500,000 taxable income for single and married-filing-separately filers, $750,000 for heads of household and $1,000,000 for joint filers. Through tax year 2026 the top rate is still 11 percent, so a sentence about 2026 law saying 11 percent is not wrong. The act is Act 24, not Act 25.

- id: millionaires-count
  says: Number of Hawaiʻi residents with $1 million or more in net wealth
  value: 81814
  unit: count
  shown: "81,814"
  as_of: "2024"
  source: Altrata (formerly Wealth-X), Market Sizing Wealth Data for Hawaiʻi, November 9, 2025, "$1m+" row
  match: millionaire
  status: confirmed
  checked: Claude against the Altrata export, 2026-11-23
  note: All Altrata tiers are cumulative ($1m+ includes $20m+ and $50m+). 83,059 and 83,424 were double-counted totals from older dashboard versions.

- id: wfc-eitc-loss-2028
  says: State EITC that working families would lose in tax year 2028 if the Act 163 expansions lapse
  value: 41700000
  unit: usd
  shown: $41.7 million
  as_of: tax year 2028 estimate (model run of 2026-11-22)
  source: Hawaiʻi Appleseed microsimulation, Census-Forecaster site/data/working-family-credits/by_credit_ty2028.csv (90 percent range $41.1M to $42.3M)
  match: earned income tax credit loss|from the (state )?(earned income tax credit|EITC)|EITC loss
  status: confirmed
  checked: Claude against the current model output, 2026-11-23
  note: The current model gives $41.7M (EITC), $33.8M (food/excise) and $84.6M total. wfc-credits' Table 8 (42.8, range 42.1 to 43.5) and the fact sheet's $43M come from an earlier run.
