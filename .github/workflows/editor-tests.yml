name: Editor tests

# The draft editor (docsync/editor/edit.html) is a single file with no build
# step and, until now, no tests in-tree — every change was verified by hand
# in an ad-hoc /tmp Playwright harness (see docs/primer/LIBRARIES.md's #1
# recommendation). This formalizes that harness: tests/editor/ runs against
# the real local dev server (report2027/tools/serve.py) with GitHub itself
# fully mocked (tests/editor/fixtures/fake-github.js) — no real network, no
# real git push, ever.

on:
  # Every commit that lands, not just ones that arrive by PR. This repo's work
  # goes straight to main, so a pull_request-only trigger meant the suite had
  # never run once — 190 specs guarding nothing. Same path filter both ways.
  push:
    branches: [main]
    paths:
      - "docsync/**"
      - "docs/primer/start.html"
      - "docs/primer/sw.js"
      - "report2027/tools/serve.py"
      - "report2027/tools/render_report.py"
      - "tests/**"
      - "playwright.config.js"
      - "package.json"
      - ".github/workflows/editor-tests.yml"
  pull_request:
    paths:
      - "docsync/editor/edit.html"
      - "docs/primer/start.html"
      - "docs/primer/sw.js"
      - "report2027/tools/serve.py"
      - "report2027/tools/render_report.py"
      - "docsync/layout.py"
      - "docsync/content.py"
      - "tests/editor/**"
      - "playwright.config.js"
      - "package.json"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Four machines, a quarter of the suite each. One runner has two cores
    # and ran all ~780 tests in ~45 minutes, every push; sharded, the wall
    # time is the slowest quarter. fullyParallel splits by test, not by file,
    # so the quarters come out even.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # pymupdf: the ingest-notices and insert-image specs build their test
        # PDFs with fitz — it was never added when docsync.ingest shipped, so
        # every editor-tests run since 2026-08-19 failed on the runner while
        # passing locally.
        run: pip install --quiet pyyaml pymupdf

      - name: Self-test the docsync engine
        if: matrix.shard == 1
        run: python3 docsync/test_docsync.py

      # Also guards edit.html's inline script: its stylesheet is a JS template
      # literal, so a stray backtick anywhere in it kills the whole editor with
      # no console error. Cheap, and catches a whole class of silent breakage.
      - name: Render tolerances + edit.html syntax guard
        if: matrix.shard == 1
        run: python3 report2027/tools/test_render.py

      # 22, not 20: the collab relay's wrangler and miniflare require it.
      # Under 20, `wrangler dev` never came up, and both collab specs died in
      # their 90-second beforeAll on every run.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          # Both lockfiles, because two npm projects are installed below and a
          # change to either one has to miss the cache.
          cache-dependency-path: |
            package-lock.json
            collab/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      # collab/ is its own npm project and the root `npm ci` does not reach it.
      # The two collab specs boot `wrangler dev` (collab/devserver.mjs) inside a
      # 90-second beforeAll; wrangler is a devDependency THERE, so without this
      # step `npx wrangler` on the runner fell through to fetching it from the
      # registry and the hook died before it could serve — with Playwright's own
      # "beforeAll hook timeout" rather than startDev's message, because the two
      # budgets are both 90s. Same shape as pymupdf above: present on every
      # machine that had ever run it by hand, never installed on CI.
      - name: Install the collab relay's dependencies
        run: npm ci --prefix collab

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the editor test suite
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
